<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 350" width="940" height="350" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'PingFang SC', sans-serif">
  <rect width="940" height="350" fill="#FBFAF7"/>
  <text x="60" y="46" font-size="18" font-weight="600" fill="#2C2C2A">视频到高斯泼溅：三段式链路</text>
  <text x="60" y="68" font-size="13" fill="#5F5E5A">每一段的产物是下一段的唯一输入，所以前一段没解准，后一段再久也补不回来</text>

  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g>
    <rect x="60" y="100" width="230" height="112" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/>
    <text x="80" y="128" font-size="15" font-weight="600" fill="#2C2C2A">① 画面准备</text>
    <text x="80" y="150" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#185FA5">FFmpeg 8.1.2</text>
    <text x="80" y="172" font-size="12" fill="#5F5E5A">按档位抽帧，必要时补帧</text>
    <text x="80" y="191" font-size="12" fill="#5F5E5A">与缩放</text>
  </g>
  <line x1="292" y1="156" x2="352" y2="156" stroke="#888780" stroke-width="1.6" marker-end="url(#a1)"/>
  <text x="322" y="143" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#5F5E5A">.JPG</text>

  <g>
    <rect x="355" y="100" width="230" height="112" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/>
    <text x="375" y="128" font-size="15" font-weight="600" fill="#2C2C2A">② 相机重建</text>
    <text x="375" y="150" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#185FA5">COLMAP 4.2.1</text>
    <text x="375" y="172" font-size="12" fill="#5F5E5A">SIFT 特征 → 顺序匹配 →</text>
    <text x="375" y="191" font-size="12" fill="#5F5E5A">增量重建 + BA</text>
  </g>
  <line x1="587" y1="156" x2="647" y2="156" stroke="#888780" stroke-width="1.6" marker-end="url(#a1)"/>
  <text x="617" y="143" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#5F5E5A">位姿</text>

  <g>
    <rect x="650" y="100" width="230" height="112" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/>
    <text x="670" y="128" font-size="15" font-weight="600" fill="#2C2C2A">③ 训练</text>
    <text x="670" y="150" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#185FA5">Brush / OOOBrush</text>
    <text x="670" y="172" font-size="12" fill="#5F5E5A">初始化高斯 → 可微渲染 →</text>
    <text x="670" y="191" font-size="12" fill="#5F5E5A">致密化（分裂 / 克隆）</text>
  </g>

  <g>
    <rect x="60" y="228" width="230" height="34" rx="6" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.8"/>
    <text x="175" y="250" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0C447C">113 张 JPG</text>
  </g>
  <g>
    <rect x="355" y="228" width="230" height="34" rx="6" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.8"/>
    <text x="470" y="250" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0C447C">cameras.bin · images.bin</text>
  </g>
  <g>
    <rect x="650" y="228" width="230" height="34" rx="6" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.8"/>
    <text x="765" y="250" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0C447C">final.ply</text>
  </g>

  <text x="60" y="296" font-size="12" fill="#5F5E5A">第①段决定「有多少视角」，第②段决定「视角有多准」，第③段只能在给定几何上做拟合。</text>
  <text x="60" y="318" font-size="12" fill="#5F5E5A">实测中画质差距的主要来源是第①段的拍摄距离，而不是第③段的训练时长。</text>
</svg>
