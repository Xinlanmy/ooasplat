<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'PingFang SC', sans-serif">
  <rect width="940" height="400" fill="#FBFAF7"/>
  <text x="40" y="44" font-size="18" font-weight="600" fill="#2C2C2A">致密化：分裂与克隆</text>
  <text x="40" y="66" font-size="13" fill="#5F5E5A">两者都由「欠重建」触发，区别只在原高斯的大小：大的拆开，小的复制。</text>

  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="a4b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#378ADD" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="104" font-size="14" font-weight="600" fill="#0F6E56">分裂 split</text>
  <text x="40" y="124" font-size="12" fill="#5F5E5A">原高斯尺度偏大</text>

  <ellipse cx="240" cy="165" rx="54" ry="35" fill="#1D9E75" fill-opacity="0.16" stroke="#1D9E75" stroke-width="1.2"/>
  <text x="240" y="169" text-anchor="middle" font-size="11" fill="#0F6E56">父代</text>
  <line x1="240" y1="202" x2="240" y2="238" stroke="#1D9E75" stroke-width="1.4" marker-end="url(#a4)"/>
  <text x="254" y="224" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0F6E56">尺度 / 1.6</text>

  <ellipse cx="196" cy="290" rx="34" ry="23" fill="#1D9E75" fill-opacity="0.2" stroke="#1D9E75" stroke-width="1"/>
  <ellipse cx="286" cy="290" rx="34" ry="23" fill="#1D9E75" fill-opacity="0.2" stroke="#1D9E75" stroke-width="1"/>
  <text x="240" y="336" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0F6E56">数量 +1　总体积 ×0.78</text>

  <line x1="400" y1="100" x2="400" y2="350" stroke="#D3D1C7" stroke-width="1"/>

  <text x="440" y="104" font-size="14" font-weight="600" fill="#185FA5">克隆 clone</text>
  <text x="440" y="124" font-size="12" fill="#5F5E5A">原高斯尺度偏小</text>

  <ellipse cx="620" cy="205" rx="46" ry="29" fill="#378ADD" fill-opacity="0.14" stroke="#378ADD" stroke-width="1.2"/>
  <ellipse cx="712" cy="205" rx="46" ry="29" fill="#378ADD" fill-opacity="0.14" stroke="#378ADD" stroke-width="1.2"/>
  <text x="620" y="209" text-anchor="middle" font-size="11" fill="#0C447C">父代</text>
  <text x="712" y="209" text-anchor="middle" font-size="11" fill="#0C447C">副本</text>
  <line x1="620" y1="248" x2="712" y2="248" stroke="#378ADD" stroke-width="1.4" marker-end="url(#a4b)"/>
  <text x="666" y="270" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0C447C">沿梯度平移</text>
  <text x="666" y="290" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0C447C">数量 +1　总体积 ×2</text>

  <line x1="40" y1="350" x2="900" y2="350" stroke="#D3D1C7" stroke-width="1"/>

  <text x="40" y="374" font-size="12" fill="#5F5E5A">克隆让覆盖范围扩张，是 splat 数量增长的主因；分裂让尺度下降，是细节收敛的主因。</text>
  <text x="40" y="392" font-size="12" fill="#5F5E5A">两者都靠梯度阈值触发 —— 光滑曲面上梯度平缓，所以不触发，这正是「加分辨率不加细节」的机制。</text>
</svg>
